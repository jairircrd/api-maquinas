
services:
  postgres:
    image: postgres:16
    container_name: api-maquinas-postgres
    environment:
      POSTGRES_DB: monitoramento_maquinas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitoramento_maquinas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dados:
